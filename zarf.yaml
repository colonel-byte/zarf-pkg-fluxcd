---
# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
kind: ZarfPackageConfig
metadata:
  name: pkg-fluxcd
  # renovate: datasource=github-releases depName=fluxcd/flux2
  version: v2.10.0
  source: https://github.com/colonel-byte/zarf-pkg-fluxcd
  annotations:
    org.opencontainers.image.source: https://github.com/colonel-byte/zarf-pkg-fluxcd
    org.opencontainers.image.description: Zarf package for deploying fluxcd
components:
  - name: fluxcd-core
    required: true
    only:
      flavor: upstream
    manifests:
      - name: fluxcd
        namespace: flux-system
        kustomizations:
          - upstream/core
    images:
      - ghcr.io/fluxcd/helm-controller:v1.7.1
      - ghcr.io/fluxcd/kustomize-controller:v1.10.1
      - ghcr.io/fluxcd/notification-controller:v1.10.0
      - ghcr.io/fluxcd/source-controller:v1.10.1
  - name: fluxcd-image-controller
    required: false
    only:
      flavor: upstream
    manifests:
      - name: fluxcd
        namespace: flux-system
        kustomizations:
          - upstream/images
    images:
      - ghcr.io/fluxcd/image-automation-controller:v1.3.0
      - ghcr.io/fluxcd/image-reflector-controller:v1.3.0
  - name: fluxcd-source-watcher
    required: false
    only:
      flavor: upstream
    manifests:
      - name: fluxcd
        namespace: flux-system
        kustomizations:
          - upstream/source
    images:
      - ghcr.io/fluxcd/source-watcher:v2.3.1
