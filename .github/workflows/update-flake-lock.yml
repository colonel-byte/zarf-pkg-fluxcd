name: Update lock
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # every Sunday at midnight

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: chainguard-dev/actions/setup-gitsign@142d22e4cec7c824db396585b9bc86f76f7c1732 # v1.6.35

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Update flake
        run: |-
          nix flake update

      - name: Commit & Push changes
        uses: actions-js/push@968f4695ca558093eadb24ad83cc5891f47e0cdc # v1.6
        with:
          branch: 'main'
          message: "chore(flake): bump inputs"
          github_token: ${{ secrets.GITHUB_TOKEN }}
